# SearXNG on its own (e.g. on an office PC or a small VPS), for the app's free search.
#   export SEARXNG_SECRET=$(openssl rand -hex 32)
#   docker compose -f searxng/docker-compose.yml up -d          (run from the repository root)
# Then set SEARXNG_URL: http://localhost:8888 for a worker on the same machine, or the public URL of this
# machine for the Vercel app (see README “Free search with SearXNG” — put it behind a password or a tunnel).
services:
  searxng:
    image: searxng/searxng:latest
    ports: ["${SEARXNG_PORT:-8888}:8080"]
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-please-change-me}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
    restart: unless-stopped
