<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Intelligence Designed To Evolve</title>
  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link
    href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video class="bg-video" autoplay muted loop playsinline>
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4"
        type="video/mp4"
      />
    </video>
  </div>

  <div class="page">
    <!-- 1) Header -->
    <header class="header">
      <a class="logo" href="./" aria-label="Home">
        <img src="assets/logo.webp" alt="" width="52" height="52" />
      </a>

      <nav class="nav" aria-label="Main">
        <a class="nav-link is-active" href="./" aria-current="page">Home</a>
        <a class="nav-link" href="app.html#search">Product</a>
        <a class="nav-link" href="app.html#leads">Case Studies</a>
        <a class="nav-link" href="app.html#outreach">Contact</a>
      </nav>

      <a class="sign-in" href="app.html#settings">Sign in</a>

      <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- Mobile menu -->
    <div class="menu-overlay" hidden></div>
    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile" hidden>
      <a class="m-link is-active" href="./" aria-current="page" style="--i: 0">Home</a>
      <a class="m-link" href="app.html#search" style="--i: 1">Product</a>
      <a class="m-link" href="app.html#leads" style="--i: 2">Case Studies</a>
      <a class="m-link" href="app.html#outreach" style="--i: 3">Contact</a>
      <a class="m-sign-in" href="app.html#settings" style="--i: 4">Sign in</a>
    </nav>

    <!-- 2) Hero -->
    <main class="hero">

      <h1 class="headline anim">
        <span class="line l1">Intelligence</span>
        <span class="line l2">Designed To Evolve</span>
      </h1>

      <p class="subhead anim" style="--d: 0.28s">
        Get your customers and clients in one search — AI finds the right people
        and businesses across the web and hands you their contacts.
      </p>

      <a class="cta anim" href="app.html#search" style="--d: 0.4s">Get Started</a>
    </main>

  </div>

  <script src="main.js"></script>
</body>
</html>
